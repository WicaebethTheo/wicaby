name: CI

# Cost notes: this repo is private, so Actions minutes count against the account quota, every job is
# billed rounded up to the minute, and Windows minutes count double. Hence:
#   - one cheap `changes` job that also runs the repo-wide checks (privacy, links, actionlint), and
#     gates the heavy jobs on the paths that changed: a docs-only change runs nothing else;
#   - the Windows desktop job runs on pushes to main (and by hand), and on a pull request only when a
#     Windows-specific file changed; the Linux desktop job covers every other pull request;
#   - a new push to the same branch or pull request cancels the run in progress (main included: only
#     the newest commit of main needs a verdict; re-run an older one by hand before tagging it);
#   - release.yml only takes a commit whose Android and Linux desktop jobs passed, not skipped: when the
#     path filters skipped them, Run workflow on main runs every job;
#   - npm, Go and Gradle caches; per-job timeouts.
# Tags do not run this workflow: release.yml builds them, after checking that the CI of the tagged
# commit on main is green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes + repo checks (privacy, links, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists a pull request's files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
      mesh: ${{ steps.filter.outputs.mesh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # code: anything the self-checks read (they parse Android, desktop and workflow sources, and the
      # root READMEs, CHANGELOG, notices and licences), so only docs/, SECURITY.md and the GitHub
      # templates are "docs only".
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'tools/**'
              - 'brand/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.gitattributes'
              - '.github/workflows/**'
              - 'README*.md'
              - 'CONTRIBUTING.md'
              - 'CHANGELOG.md'
              - 'THIRD_PARTY_NOTICES.md'
              - 'LICENSE*'
            desktop:
              - 'apps/desktop/**'
              - 'packages/tokens/**'
              - 'tools/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            windows:
              - '**/*.ps1'
              - '**/*.bat'
              - '**/*.cmd'
              - 'apps/desktop/electron-builder.yml'
              - 'apps/desktop/build/**'
              - '.github/workflows/ci.yml'
            android:
              - 'apps/android/**'
              - 'packages/tokens/**'
              - 'packages/mesh/**'
              - 'tools/checks/flavour-check.mjs'
              # Android unit tests read the shared vectors and run the mocks in place.
              - 'tools/checks/fixtures/**'
              - 'tools/mock-server/**'
              - '.github/workflows/ci.yml'
            mesh:
              - 'packages/mesh/**'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Generic patterns only: the maintainer's .dev/privacy-patterns.json is never in git.
      - name: Privacy check
        run: node tools/checks/privacy-check.mjs

      - name: Markdown links (relative links and images)
        run: node tools/checks/links-check.mjs

      # Here, not only in npm run checks: a docs-only change (new README screenshots) skips the desktop jobs.
      - name: Screenshot metadata
        run: node tools/screenshots/strip-metadata.mjs --check

      # actionlint 1.7.12, checksum-verified release binary (shellcheck from the runner image checks
      # the run: scripts).
      - name: actionlint
        run: |
          set -euo pipefail
          v=1.7.12
          sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          f="actionlint_${v}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v$v/$f"
          echo "$sum  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  desktop-linux:
    name: Desktop / Linux (type-check, self-checks, build, AppImage + deb)
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    # Same image as the release Linux job, which builds the shipped libmpv addon.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mesh/go.mod
          cache-dependency-path: packages/mesh/go.sum

      # Root package.json is the npm workspaces root (workspace: apps/desktop).
      - name: Install
        run: npm ci

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      # The platform-dependent checks cover win32 and linux either way.
      - name: Self-checks (every check in tools/checks/run-all.mjs)
        run: npm run checks

      # pkg-config (binding.gyp shells out to it) and the EGL, GLESv2 and GBM headers for the libmpv render
      # addon (apps/desktop/native/mpv-render, built by `npm run build`); the mpv headers are vendored and libmpv
      # is dlopened, so no libmpv-dev.
      - name: Native addon build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgbm-dev libegl-dev libgles-dev

      - name: Build renderer + main + native addon
        run: npm run build

      # npm run checks ran before the build, where this check skips; here the addon must exist. Plain Node and no
      # libmpv on the runner, so the Electron-only libffmpeg rebind is not exercised (docs/desktop.md).
      - name: Native addon (loads, probe(), no libmpv or libstdc++ link)
        run: node tools/checks/native-addon-check.mjs --require

      # vendor/vpn-helper/wicaby-mesh + THIRD_PARTY_LICENSES.txt; the script runs go test and the
      # AGPL guard on the linux/amd64 build graph.
      - name: Build mesh helper (linux/amd64, AGPL guard)
        env:
          GOOS: linux
          GOARCH: amd64
        run: npm run build:mesh

      # electron-builder downloads its own appimagetool and fpm. The deb needs a Homepage, taken
      # from extraMetadata (no homepage in package.json).
      - name: Package AppImage + deb
        working-directory: apps/desktop
        run: npx electron-builder --linux AppImage deb --x64 --publish never -c.extraMetadata.homepage=https://github.com/${{ github.repository }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 3

  desktop-windows:
    name: Desktop / Windows (self-checks, build)
    needs: changes
    # Mandatory on main (and by hand); on a pull request only when a Windows-specific file changed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.desktop == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.windows == 'true')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # No type-check here: svelte-check and tsc give the same result on Linux (desktop-linux).
      - name: Self-checks (every check in tools/checks/run-all.mjs)
        run: npm run checks

      - name: Build renderer + main
        run: npm run build

  mesh:
    name: Mesh helper (Go tests, AGPL guard)
    needs: changes
    if: needs.changes.outputs.mesh == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mesh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mesh/go.mod
          cache-dependency-path: packages/mesh/go.sum

      # -race: the SMB and node code share sessions across goroutines.
      - name: Test
        run: go test -race ./...

      # NetBird keeps AGPL code in management/, signal/, relay/ and combined/; none may be
      # linked into the desktop helper or the Android AAR (same guard as build-vpn-helper.mjs
      # and build-mesh-aar.ps1/.sh, run on both build graphs).
      - name: AGPL guard
        run: |
          set -euo pipefail
          agpl='github\.com/netbirdio/netbird/(management|signal|relay|combined)(/|$)'

          echo '::group::Desktop helper (windows/amd64, ./cmd/wicaby-mesh)'
          # List first, filter second: a failing `go list` must fail the step, not read as "no hits".
          deps="$(GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go list -deps ./cmd/wicaby-mesh)"
          [ -n "$deps" ] || { echo '::error::go list returned no packages for ./cmd/wicaby-mesh'; exit 1; }
          hits="$(printf '%s\n' "$deps" | grep -E "$agpl" || true)"
          echo '::endgroup::'
          if [ -n "$hits" ]; then echo "::error::AGPL NetBird packages linked into wicaby-mesh.exe:"; echo "$hits"; exit 1; fi

          echo '::group::Android AAR (android/arm64, ./mobile, release tags)'
          ts_keep='netstack,udptransport,nattraversal,portmapper,dns,health,bakedroots,tailnetlock,useproxy,ipnbus,ace,cachenetmap,serve,acme'
          tags="$(go run tailscale.com/cmd/featuretags --min "--add=$ts_keep")"
          [ -n "$tags" ] || { echo '::error::tailscale.com/cmd/featuretags returned no tags'; exit 1; }
          echo "tags: $tags"
          deps="$(GOOS=android GOARCH=arm64 CGO_ENABLED=1 go list -tags "$tags" -deps ./mobile)"
          [ -n "$deps" ] || { echo '::error::go list returned no packages for ./mobile'; exit 1; }
          hits="$(printf '%s\n' "$deps" | grep -E "$agpl" || true)"
          echo '::endgroup::'
          if [ -n "$hits" ]; then echo "::error::AGPL NetBird packages linked into wicaby-mesh.aar:"; echo "$hits"; exit 1; fi

          echo 'OK: no AGPL NetBird package in either build graph'

  android:
    name: Android (unit tests, debug builds, lint)
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mesh/go.mod
          cache-dependency-path: packages/mesh/go.sum

      # vendor/android/wicaby-mesh.aar is not in git; core links it through the ivy repo in
      # apps/android/settings.gradle.kts. Rebuilt only when the Go module or the script changes.
      - name: Restore mesh AAR
        id: aar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/android
          key: mesh-aar-${{ runner.os }}-${{ hashFiles('packages/mesh/go.mod', 'packages/mesh/go.sum', 'packages/mesh/mesh/**', 'packages/mesh/mobile/**', 'packages/mesh/scripts/build-mesh-aar.sh') }}

      # No `gomobile init`: `gomobile bind` only needs gobind on PATH, and init would replace the
      # pinned gobind with gobind@latest (x/mobile cmd/gomobile/init.go), which
      # build-mesh-aar.sh then refuses.
      - name: Install gomobile
        if: steps.aar.outputs.cache-hit != 'true'
        working-directory: packages/mesh
        run: |
          set -euo pipefail
          v="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@$v" "golang.org/x/mobile/cmd/gobind@$v"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build mesh AAR (patched NetBird, AGPL guard)
        if: steps.aar.outputs.cache-hit != 'true'
        run: bash packages/mesh/scripts/build-mesh-aar.sh

      # Gradle caches are written on main only; pull requests read them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Open-source GitHub Actions cache backend (the default 'enhanced' one is a
          # separate commercial service).
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # testDebugUnitTest runs the unit tests of the modules without flavours (core, tv, ...); mobile has
      # foss and gplay (cast spec CA-10), so it has no testDebugUnitTest: both are named. `lint` covers
      # mobile's default flavour (foss), :mobile:lintGplayDebug the other one.
      # chmod: safeguard in case gradlew lost its executable bit in git.
      - name: Unit tests, debug builds, lint
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace testDebugUnitTest :mobile:testFossDebugUnitTest :mobile:testGplayDebugUnitTest :tv:assembleDebug :mobile:assembleDebug lint :mobile:lintGplayDebug

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # foss resolves no Play services, gplay no FFmpeg decoder (cast spec CA-10).
      - name: Flavour dependencies
        run: node tools/checks/flavour-check.mjs --gradle

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/*/build/reports/
            apps/android/*/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
