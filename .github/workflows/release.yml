name: Release

# Pushing a tag v* builds the Windows installer + portable exe, the Linux AppImage, deb and tar.gz,
# and the signed Android APKs (TV foss arm64/armv7/universal, mobile foss + gplay arm64/armv7),
# writes update.json, and publishes everything as a GitHub Release.
#
# Where it publishes:
#   - by default, the Releases of THIS repository (private: the assets need a GitHub login, so the
#     apps' updater cannot read update.json from there; fine for archiving and testing);
#   - when BOTH the RELEASES_TOKEN secret and the RELEASES_REPO variable are set, the Releases of
#     RELEASES_REPO (owner/repo, e.g. a public wicaby-releases repo), through that token.
#
# Dry run: Actions > Release > Run workflow (workflow_dispatch) builds the same files from the chosen
# branch and assembles the release folder, but never publishes, creates no tag and needs no secret.
# Windows is skipped unless the "windows" input is ticked (Windows minutes count double). Without the
# signing secrets a dry run builds UNSIGNED APKs, named *-UNSIGNED.apk, and writes no update.json.
#
# A tag push never builds unsigned APKs: the preflight job fails in seconds, before the long build
# jobs start, and names every missing secret (never its value) when the tag is not vX.Y.Z[-pre],
# the tagged commit is not on main, the latest CI run of that commit is not green (still running
# counts as not green: re-run this workflow once CI has passed) or skipped its Android or Linux
# desktop job (path filters: run CI by hand on main), a signing secret is missing, or
# APK_CERT_SHA256 is not set.
#
# The build jobs restore no Go or Gradle cache: ordinary CI runs write those, and a release signs
# what it builds.
#
# Secrets (Settings > Secrets and variables > Actions), see docs/release.md#secrets:
#   KEYSTORE_BASE64    base64 of the release keystore (base64 -w0 wicaby-release.jks)
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
#   RELEASES_TOKEN     optional: fine-grained PAT with "Contents: read and write" on RELEASES_REPO only
# Variables:
#   APK_CERT_SHA256    SHA-256 of the release signing certificate (64 hex digits, colons allowed);
#                      every APK must be signed by exactly that certificate
#   RELEASES_REPO      optional: owner/repo that receives the release (with RELEASES_TOKEN)
#
# Versions: the desktop build takes its version from the tag (vX.Y.Z -> X.Y.Z; a dry run keeps the
# version of package.json). The Android apps keep their own versionName/versionCode from
# apps/android/{tv,mobile}/build.gradle.kts, and their APK names carry that versionName (what
# make-update-manifest.mjs expects, so it must stay numeric: 0.5.0, not 0.5.0-beta).
#
# mpv: the Windows build is pinned (tag, commit, SHA-256) in apps/desktop/scripts/fetch-mpv.ps1;
# the assemble job reads the tag and commit there for the release notes and the mpv source archive.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows:
        description: 'Dry run: also build the Windows installer and portable exe (Windows minutes count double)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (tag, branch, CI, secrets, target)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the CI runs of the tagged commit
    outputs:
      dry_run: ${{ steps.check.outputs.dry_run }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      signed: ${{ steps.check.outputs.signed }}
      target_repo: ${{ steps.check.outputs.target_repo }}
      external: ${{ steps.check.outputs.external }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # Full history: the ancestry check below needs origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Secrets are only tested for emptiness; no value is ever printed.
      - name: Check the tag, the branch, the CI, the secrets and the target
        id: check
        env:
          EVENT: ${{ github.event_name }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail=0
          skip=false
          err() { echo "::error::$*"; fail=1; }

          if [ "$EVENT" = push ]; then
            dry=false
            tag="$GITHUB_REF_NAME"
            # npm version (desktop) and the prerelease rule (a '-' in the tag) both expect this shape.
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || err "tag '$tag' is not vX.Y.Z or vX.Y.Z-<prerelease>"
          else
            dry=true
            tag="v$(node -p 'require("./package.json").version')"
            echo "::notice::Dry run of $tag from $GITHUB_REF_NAME ($GITHUB_SHA): builds only, nothing is published"
          fi

          # Signing: all four secrets or none. None is only accepted for a dry run.
          missing=()
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -eq 0 ] && [ "$dry" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            # The release key signs main and tags only. A notice, not enforcement: a branch can edit its own copy of this
            # file; only a GitHub Environment limited to main and v* tags holding the secrets enforces it (docs/release.md).
            signed=false
            echo "::notice::Dry run from $GITHUB_REF_NAME, not main: UNSIGNED Android APKs (*-UNSIGNED.apk) and no update.json"
          elif [ "${#missing[@]}" -eq 0 ]; then
            signed=true
            [[ "${APK_CERT_SHA256//:/}" =~ ^[0-9A-Fa-f]{64}$ ]] \
              || err "repository variable APK_CERT_SHA256 is not the 64-hex SHA-256 of the signing certificate (docs/release.md#variables)"
          elif [ "${#missing[@]}" -eq 4 ] && [ "$dry" = false ]; then
            # No signing set up yet: releases are published by hand, so a tag is not an error.
            signed=false; skip=true
            echo "::notice::No signing secrets: nothing is built for $tag (docs/release.md#secrets)"
          elif [ "${#missing[@]}" -eq 4 ] && [ "$dry" = true ]; then
            signed=false
            echo "::warning::No signing secrets: this dry run builds UNSIGNED Android APKs (*-UNSIGNED.apk) and no update.json"
          else
            signed=false
            err "signing secret(s) not set: ${missing[*]}. A release never ships unsigned APKs; set them (docs/release.md#secrets) and re-run"
          fi

          # Target: another repo only when both the token and the variable are set.
          if [ -n "$RELEASES_TOKEN" ] && [ -n "$RELEASES_REPO" ]; then
            [[ "$RELEASES_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || err "variable RELEASES_REPO '$RELEASES_REPO' is not owner/repo"
            target="$RELEASES_REPO"; external=true
          else
            if [ -n "$RELEASES_TOKEN" ] || [ -n "$RELEASES_REPO" ]; then
              echo "::warning::RELEASES_TOKEN and the RELEASES_REPO variable work together and only one is set: publishing to $GITHUB_REPOSITORY"
            fi
            target="$GITHUB_REPOSITORY"; external=false
          fi
          echo "Target: $target"

          # A release already published for this tag (by hand) is left alone, looked up where it is published.
          view_token="$GH_TOKEN"; [ "$external" = false ] || view_token="$RELEASES_TOKEN"
          if [ "$dry" = false ] && GH_TOKEN="$view_token" gh release view "$tag" -R "$target" >/dev/null 2>&1; then
            skip=true
            echo "::notice::$tag is already released: nothing to do"
          fi

          if [ "$dry" = false ] && [ "$skip" = false ]; then
            # The newest CI (ci.yml) run of this exact commit must have finished green.
            ci="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
              --jq '.workflow_runs[0] // {} | "\(.status) \(.conclusion) \(.html_url) \(.id)"')"
            if [[ "$ci" == "completed success "* ]]; then
              # The path filters skip a job whose files did not change since the previous push, and a
              # skipped job still reads as green: the release needs these jobs to have passed on this commit.
              passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${ci##* }/jobs?per_page=100" \
                --jq '.jobs[] | select(.conclusion == "success") | .name')"
              for job in 'Desktop / Linux' 'Android'; do
                grep -q "^$job " <<< "$passed" || err "CI of $GITHUB_SHA did not run the '$job' job (path filters); run CI by hand (Actions > CI > Run workflow) on main, or on a branch at this commit if main has moved on, then re-run this workflow"
              done
            else
              err "CI of $GITHUB_SHA is not green ($ci); wait for it to pass, then re-run this workflow"
            fi
            # Only commits already on main are released (a tag on another branch is refused).
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || err "$tag ($GITHUB_SHA) is not on main; tag a commit of main whose CI is green"
          fi

          {
            echo "dry_run=$dry"
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "signed=$signed"
            echo "target_repo=$target"
            echo "external=$external"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          exit "$fail"

  windows:
    name: Windows (NSIS + portable)
    needs: preflight
    if: needs.preflight.outputs.skip != 'true' && (needs.preflight.outputs.dry_run == 'false' || inputs.windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mesh/go.mod
          cache: false

      - name: Install
        run: npm ci

      - name: Stamp the desktop version from the tag
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version --workspace apps/desktop

      # vendor/mpv from the shinchiro build pinned in fetch-mpv.ps1 (direct download, SHA-256
      # checked, no API call). System32 first so tar.exe is Windows' bsdtar (reads .7z), not
      # Git's GNU tar. -Generic: the baseline x86_64 build, so the release also plays on CPUs
      # without AVX2 (Celeron/Pentium HTPCs, pre-Haswell); npm run fetch-mpv cannot pass it.
      - name: Fetch mpv
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          ./apps/desktop/scripts/fetch-mpv.ps1 -Generic

      # vendor/vpn-helper/wicaby-mesh.exe + THIRD_PARTY_LICENSES.txt (runs the AGPL guard).
      - name: Build mesh helper
        run: npm run build:mesh

      # apps/desktop `dist` = `npm run build && electron-builder --win` (NSIS and portable targets
      # from apps/desktop/electron-builder.yml); && stops before packaging if the build fails.
      # The publish job uploads.
      - name: Build installer + portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -w apps/desktop -- --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/Wicaby-*.exe
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.dry_run == 'true' && 1 || 7 }}

  # mpv is not bundled on Linux (system mpv; the deb depends on mpv >= 0.37), so no mpv source
  # archive is needed for these files.
  linux:
    name: Linux (AppImage + deb + tar.gz)
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    # Pinned, not ubuntu-latest: the libmpv addon built here (glibc symbols) must keep loading on
    # Ubuntu 24.04 and Debian 13 when the floating image moves on; libstdc++ is linked statically.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mesh/go.mod
          cache: false

      - name: Install
        run: npm ci

      - name: Stamp the desktop version from the tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version --workspace apps/desktop

      # vendor/vpn-helper/wicaby-mesh + THIRD_PARTY_LICENSES.txt (runs go test and the AGPL guard).
      - name: Build mesh helper
        env:
          GOOS: linux
          GOARCH: amd64
        run: npm run build:mesh

      # pkg-config (binding.gyp shells out to it) and the EGL, GLESv2 and GBM headers for the libmpv render
      # addon that `npm run build` compiles (apps/desktop/native/mpv-render), on the pinned Ubuntu 24.04 glibc.
      - name: Native addon build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libgbm-dev libegl-dev libgles-dev

      # apps/desktop `dist:linux` = `npm run build && electron-builder --linux` (AppImage, deb and
      # tar.gz from electron-builder.yml). The deb's Homepage is the repo that hosts the release.
      - name: Build AppImage + deb + tar.gz
        env:
          TARGET_REPO: ${{ needs.preflight.outputs.target_repo }}
        run: npm run dist:linux -w apps/desktop -- --publish never "-c.extraMetadata.homepage=https://github.com/$TARGET_REPO"

      # Plain Node, no libmpv on the runner: proves the binary loads and links nothing it must not, not the
      # Electron-only libffmpeg rebind (docs/desktop.md, native/mpv-render/test for the manual checks).
      - name: Native addon (loads, probe(), no libmpv or libstdc++ link)
        run: node tools/checks/native-addon-check.mjs --require

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.dry_run == 'true' && 1 || 7 }}

  android:
    name: Android APKs
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mesh/go.mod
          cache: false

      # No `gomobile init`: `gomobile bind` only needs gobind on PATH, and init would replace the
      # pinned gobind with gobind@latest (x/mobile cmd/gomobile/init.go), which
      # build-mesh-aar.sh then refuses.
      - name: Install gomobile
        working-directory: packages/mesh
        run: |
          set -euo pipefail
          v="$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
          go install "golang.org/x/mobile/cmd/gomobile@$v" "golang.org/x/mobile/cmd/gobind@$v"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Always rebuilt for a release (no cache): arm64-v8a + armeabi-v7a, patched NetBird, AGPL guard.
      - name: Build mesh AAR
        run: bash packages/mesh/scripts/build-mesh-aar.sh

      # Only when preflight saw all four secrets (always the case for a tag push).
      - name: Write signing config
        if: needs.preflight.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: apps/android
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/wicaby-release.jks
          # java.util.Properties reads ISO-8859-1 and drops leading whitespace: escape backslashes, line breaks, a
          # leading blank, and non-ASCII as \uXXXX (UTF-16 pairs). storeFile is relative to apps/android.
          # shellcheck disable=SC2016 # $1 and $_ are Perl's
          esc() { printf '%s' "$1" | perl -CS -0777 -pe 's/\\/\\\\/g; s/\n/\\n/g; s/\r/\\r/g; s/^([ \t\f])/\\$1/; s/([^\x00-\x7f])/join "", map { sprintf "\\u%04x", $_ } (ord($1) > 0xffff ? (0xd800 + ((ord($1) - 0x10000) >> 10), 0xdc00 + ((ord($1) - 0x10000) & 0x3ff)) : ord($1))/ge'; }
          {
            echo "storeFile=keystore/wicaby-release.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > keystore.properties
          chmod 600 keystore.properties keystore/wicaby-release.jks

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Assemble release APKs
        working-directory: apps/android
        run: |
          chmod +x gradlew
          # Mobile in both flavours (cast spec CA-10): foss (FFmpeg, no Google code) and gplay (Google Cast).
          ./gradlew --stacktrace :tv:assembleRelease :mobile:assembleFossRelease :mobile:assembleGplayRelease

      - name: Remove signing material
        if: always()
        working-directory: apps/android
        run: rm -rf keystore keystore.properties

      # tv-armeabi-v7a-release.apk -> dist/tv/Wicaby-TV-<versionName>-armv7.apk; mobile-foss-arm64-v8a-release.apk
      # -> dist/mobile/Wicaby-Mobile-<versionName>-arm64.apk (foss keeps the 0.2.0 names and the "mobile" update
      # channel); mobile-gplay-arm64-v8a-release.apk -> dist/mobile-gplay/Wicaby-Mobile-Cast-<versionName>-arm64.apk.
      # Unsigned (dry run without secrets): Gradle's *-release-unsigned.apk -> Wicaby-...-<abi>-UNSIGNED.apk.
      - name: Verify signatures and rename
        env:
          SIGNED: ${{ needs.preflight.outputs.signed }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$APK_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          # shellcheck disable=SC2012 # build-tools versions are plain dotted numbers
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          aapt2="${bt}aapt2"; apksigner="${bt}apksigner"
          if [ "$SIGNED" = true ]; then in_sfx=''; out_sfx=''; else in_sfx='-unsigned'; out_sfx='-UNSIGNED'; fi
          collect() { # <module> <flavour or ""> <dist dir> <label> <abi-split:suffix>...
            local module="$1" flavour="$2" out="$3" label="$4"; shift 4
            local dir="apps/android/$module/build/outputs/apk/${flavour:+$flavour/}release"
            if [ "$SIGNED" = true ] && ls "$dir"/*-unsigned.apk >/dev/null 2>&1; then echo "::error::$module $flavour produced unsigned APKs"; exit 1; fi
            mkdir -p "dist/$out"
            for pair in "$@"; do
              local split="${pair%%:*}" suffix="${pair##*:}"
              local apk="$dir/$module-${flavour:+$flavour-}$split-release$in_sfx.apk"
              [ -f "$apk" ] || { echo "::error::missing $apk"; ls -la "$dir"; exit 1; }
              if [ "$SIGNED" = true ]; then
                "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
                # Every signer must be the release certificate (APK_CERT_SHA256, checked by preflight).
                local certs
                certs="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | sort -u)"
                if [ "$certs" != "$expected" ]; then
                  echo "::error::$apk is signed by '$certs', expected $expected"; exit 1
                fi
              fi
              local ver
              ver="$("$aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
              [ -n "$ver" ] || { echo "::error::no versionName in $apk"; exit 1; }
              # make-update-manifest.mjs only reads numeric versionNames; any other one would
              # silently leave this app out of update.json.
              [[ "$ver" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::$module versionName '$ver' is not numeric (X.Y.Z)"; exit 1; }
              cp "$apk" "dist/$out/Wicaby-$label-$ver-$suffix$out_sfx.apk"
            done
          }
          collect tv "" tv TV armeabi-v7a:armv7 arm64-v8a:arm64 universal:universal
          collect mobile foss mobile Mobile armeabi-v7a:armv7 arm64-v8a:arm64
          collect mobile gplay mobile-gplay Mobile-Cast armeabi-v7a:armv7 arm64-v8a:arm64
          # Licence texts of every Go module linked into the mesh AAR (written by build-mesh-aar.sh).
          cp vendor/android/wicaby-mesh-THIRD_PARTY_LICENSES.txt dist/
          ls -la dist dist/tv dist/mobile dist/mobile-gplay

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            dist/tv/*.apk
            dist/mobile/*.apk
            dist/mobile-gplay/*.apk
            dist/wicaby-mesh-THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.dry_run == 'true' && 1 || 7 }}

  # Everything a release needs, assembled read-only; a dry run stops here.
  assemble:
    name: Assemble (update.json, notes, sources, checksums)
    needs: [preflight, windows, linux, android]
    # Windows is skipped in a dry run unless asked for; every other build must have succeeded.
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      needs.linux.result == 'success' && needs.android.result == 'success' &&
      (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && needs.preflight.outputs.dry_run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      TARGET_REPO: ${{ needs.preflight.outputs.target_repo }}
      DRY_RUN: ${{ needs.preflight.outputs.dry_run }}
      SIGNED: ${{ needs.preflight.outputs.signed }}
    steps:
      # For tools/release/make-update-manifest.mjs, CHANGELOG.md, the build.gradle.kts fallback
      # and the source archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # make-update-manifest.mjs reads release/{tv,mobile,mobile-gplay}/*.apk; the mesh
      # licence file lands in release/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows.result == 'success'
        with:
          name: windows
          path: release/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: release/linux

      # The matching "## [X.Y.Z]" section of CHANGELOG.md (Keep a Changelog), if any. Used both
      # as the in-app changelog (update.json notes.en) and as the GitHub release body.
      - name: Changelog section
        run: |
          set -euo pipefail
          version="${TAG#v}"
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            # Skips the "[x.y.z]: https://..." link definitions that follow the last section.
            awk -v v="$version" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## / { exit } f && /^\[[^]]+\]: / { next } f' CHANGELOG.md > release-notes.md
          fi
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' release-notes.md
          sed -i -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' release-notes.md
          if [ -s release-notes.md ]; then cat release-notes.md; else echo "::warning::no CHANGELOG.md section for $version; update.json notes stay empty"; fi

      # Unsigned APKs (dry run without secrets) get no manifest: nothing could install them as an update.
      - name: Write update.json
        if: env.SIGNED == 'true'
        env:
          # Reads the current manifest of the target repo (a private one needs a token).
          GH_TOKEN: ${{ needs.preflight.outputs.external == 'true' && secrets.RELEASES_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Keeps the notes of the current release for an unchanged versionCode (the script
          # merges them); absent on the very first release.
          gh release download -R "$TARGET_REPO" --pattern update.json --dir release 2>/dev/null \
            || echo "No update.json in the latest release of $TARGET_REPO (first release)"
          # --flat: the APKs sit next to update.json as release assets, not in tv/, mobile/ and mobile-gplay/.
          # --notes-en: the CHANGELOG section, for both apps (release/<app>/NOTES.en.txt would
          # override it per app). CHANGELOG.md is English only; a French UI falls back
          # to notes.en (UpdateLogic.notes).
          # aapt2 (versionCode) comes from the runner's $ANDROID_HOME/build-tools.
          notes=()
          [ -s release-notes.md ] && notes=(--notes-en "$(cat release-notes.md)")
          node tools/release/make-update-manifest.mjs "https://github.com/$TARGET_REPO/releases/download/$TAG/" --flat "${notes[@]}"
          cat release/update.json

      # GPL-3.0 section 6: the complete corresponding source of the tagged commit, published next
      # to the binaries (the code repo is private), with the licence texts.
      - name: Source archive and licence texts
        run: |
          set -euo pipefail
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="wicaby-$version/" -o "release/wicaby-$version-source.tar.gz" "$GITHUB_SHA"
          cp LICENSE release/LICENSE.txt
          # The GPL section 7 permission the gplay APKs (Wicaby-Mobile-Cast-*) are conveyed under.
          cp LICENSE-EXCEPTION.md release/LICENSE-EXCEPTION.md
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          ls -la release

      # GPL source of the bundled mpv, pinned in fetch-mpv.ps1: shinchiro's build recipes at the
      # tag and mpv itself at the commit, in one archive.
      - name: mpv source archive
        id: mpv
        run: |
          set -euo pipefail
          ps1=apps/desktop/scripts/fetch-mpv.ps1
          tag="$(awk -F"'" '/^\$MpvTag = / { print $2 }' "$ps1")"
          commit="$(awk -F"'" '/^\$MpvCommit = / { print $2 }' "$ps1")"
          [[ "$tag" =~ ^[0-9]{8}$ && "$commit" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::no MpvTag/MpvCommit in $ps1"; exit 1; }
          src="mpv-winbuild-$tag-source"
          mkdir -p "$RUNNER_TEMP/$src"
          curl -fsSL "https://github.com/shinchiro/mpv-winbuild-cmake/archive/refs/tags/$tag.tar.gz" -o "$RUNNER_TEMP/$src/mpv-winbuild-cmake-$tag.tar.gz"
          curl -fsSL "https://github.com/mpv-player/mpv/archive/$commit.tar.gz" -o "$RUNNER_TEMP/$src/mpv-$commit.tar.gz"
          tar -czf "release/$src.tar.gz" -C "$RUNNER_TEMP" "$src"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Release notes and checksums
        env:
          MPV_TAG: ${{ steps.mpv.outputs.tag }}
          MPV_COMMIT: ${{ steps.mpv.outputs.commit }}
        run: |
          set -euo pipefail
          cp release-notes.md release/notes.md
          [ -s release/notes.md ] || echo "Wicaby $TAG" > release/notes.md
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitutions
          {
            echo
            echo '**Android TV:** most TVs need `armv7`; 64-bit boxes take `arm64`; `universal` runs on both but is larger.'
            echo '**Android phones and tablets:** `arm64` for almost every recent phone, `armv7` for older 32-bit devices.'
            echo '`Wicaby-Mobile-*` is the free build (no Google code, FFmpeg audio decoding). `Wicaby-Mobile-Cast-*` adds Chromecast and Google TV through Google Play services (proprietary; see `LICENSE-EXCEPTION.md`) and has no FFmpeg decoder: the server converts those audio formats. Both install over each other and keep your data; each one only updates to its own kind.'
            echo '**Windows:** the `-x64.exe` is the installer, the `-portable.exe` runs without installing.'
            echo '**Linux (x64, X11 or XWayland):** the `.deb` for Debian and Ubuntu (installs mpv 0.37 or later as a dependency); the `.AppImage` and the `.tar.gz` run anywhere but need `mpv` 0.37 or later from your distribution.'
            echo "**Source code:** \`wicaby-${TAG#v}-source.tar.gz\` is the complete source of this release (GPL-3.0-or-later); see \`THIRD_PARTY_NOTICES.md\`."
            echo "**mpv (Windows):** [shinchiro/mpv-winbuild-cmake \`$MPV_TAG\`](https://github.com/shinchiro/mpv-winbuild-cmake/releases/tag/$MPV_TAG), mpv \`git-$MPV_COMMIT\`; its source is \`mpv-winbuild-$MPV_TAG-source.tar.gz\`."
          } >> release/notes.md
          # A dry run may have no Windows files (nullglob) and no update.json (unsigned APKs).
          shopt -s nullglob
          cd release
          files=(windows/*.exe linux/* tv/*.apk mobile/*.apk mobile-gplay/*.apk wicaby-*-source.tar.gz mpv-winbuild-*-source.tar.gz LICENSE.txt LICENSE-EXCEPTION.md THIRD_PARTY_NOTICES.md wicaby-mesh-THIRD_PARTY_LICENSES.txt)
          if [ -f update.json ]; then files+=(update.json); fi
          sha256sum "${files[@]}" | sed 's#  [^ ]*/#  #' > SHA256SUMS.txt
          cd ..
          cat release/SHA256SUMS.txt
          if [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run complete for $TAG (would publish to $TARGET_REPO); nothing was published"
          fi

      # Handed to the publish job, the only one with write access.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.DRY_RUN == 'false'
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish (GitHub Release)
    needs: [preflight, assemble]
    if: needs.preflight.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release when it goes to this repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Prerelease?
        id: kind
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: ${{ needs.preflight.outputs.target_repo }}
          token: ${{ needs.preflight.outputs.external == 'true' && secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Wicaby ${{ needs.preflight.outputs.tag }}
          body_path: release/notes.md
          prerelease: ${{ steps.kind.outputs.prerelease }}
          # releases/latest/download/update.json must only ever point at a stable release.
          make_latest: ${{ steps.kind.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/windows/Wicaby-*.exe
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/*.tar.gz
            release/tv/Wicaby-TV-*.apk
            release/mobile/Wicaby-Mobile-*.apk
            release/mobile-gplay/Wicaby-Mobile-Cast-*.apk
            release/update.json
            release/wicaby-*-source.tar.gz
            release/mpv-winbuild-*-source.tar.gz
            release/LICENSE.txt
            release/LICENSE-EXCEPTION.md
            release/THIRD_PARTY_NOTICES.md
            release/wicaby-mesh-THIRD_PARTY_LICENSES.txt
            release/SHA256SUMS.txt
