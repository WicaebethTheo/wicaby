# Version catalog for the apps/android build (loaded automatically as `libs`).
# Versions checked against Google Maven, Maven Central and services.gradle.org on 2026-10-11.
# packages/mesh/android/sample includes :core and :mesh-ui, so it imports this same file explicitly.
#
# Not in the catalog:
#   - Gradle wrapper 9.8.1: gradle/wrapper/gradle-wrapper.properties
#   - wicaby.vendor:wicaby-mesh:0@aar: the local ivy repo artifact stays a string coordinate.

[versions]
# Build toolchain
agp = "9.5.0"                       # latest stable (9.5.0 is alpha). Needs Gradle >= 9.6.0, max API 37.
kotlin = "2.4.21"                   # latest stable (2.5.0-Beta1 only). Drives the compose + serialization plugins.
compileSdk = "37"
targetSdk = "37"
minSdkTv = "23"
minSdkMobile = "26"

# Compose
composeBom = "2026.09.00"           # -> ui/foundation/runtime 1.12.1, material3 1.4.0, material3.adaptive 1.3.0
tvMaterial = "1.1.0"
activityCompose = "1.13.0"

# AndroidX
annotation = "1.11.0"               # was 1.9.1
appcompat = "1.8.0"                 # was 1.7.1 (minSdk 21 -> 23; fine, our floor is 23)
datastore = "1.3.0"
lifecycle = "2.11.0"                # was 2.9.4 (compose artifacts need compileSdk 37 + AGP 9.1: both met)
navigation = "2.10.2"
work = "2.12.0"
profileinstaller = "1.4.1"

# Media
media3 = "1.11.1"                   # all androidx.media3 artifacts move together
jellyfinFfmpeg = "1.9.0+1"          # built against Media3 1.9.0; Jellyfin ships it with Media3 1.11.1
assMedia = "0.5.1"                  # built against Media3 1.8.0 (pulls media3-effect 1.8.0: pinned below)

# Network / serialization / images
okhttp = "5.5.1"
kotlinxSerialization = "1.12.0"     # 1.12.0 is RC only
coil = "3.6.3"
libarchive = "1.1.7"                # libarchive 3.8.1 (BSD-2): CBR (RAR4/RAR5), CB7, CBT comics with its own BSD RAR readers.
                                    # shortcut: 1.1.7 (libarchive 3.8.8) needs compileSdk 37.2; move to it with the next compileSdk bump.

# Misc
zxing = "3.5.4"                     # was 3.5.3
junit = "4.13.2"
androidxTestRunner = "1.7.0"          # core ComicNativeTest (libarchive, PdfRenderer) on a device
robolectric = "4.17"                # mobile notification tests (CA-05); tests pin @Config(sdk = 34)

[libraries]
# Compose (versions from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# AndroidX
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

# Media3
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# Not used directly: ass-media 0.5.1 pulls media3-effect 1.8.0 and Media3 publishes no BOM or
# alignment constraints, so it would otherwise stay at 1.8.0 next to media3-common 1.11.1.
# Declare it in :core as runtimeOnly(libs.androidx.media3.effect) (ass-media uses it at runtime scope).
androidx-media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
# The gplay flavour of :mobile only (cast spec CA-10): pulls play-services-cast-framework and mediarouter.
androidx-media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
jellyfin-media3-ffmpeg-decoder = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version.ref = "jellyfinFfmpeg" }
ass-media = { module = "io.github.peerless2012:ass-media", version.ref = "assMedia" }
# libass bindings (AssRender.setFontScale); ass-media only has it at runtime scope.
ass-kt = { module = "io.github.peerless2012:ass-kt", version.ref = "assMedia" }

# Network / serialization / images
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }

# Misc
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
libarchive = { module = "me.zhanghai.android.libarchive:library", version.ref = "libarchive" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# The XmlPullParser Android ships, for :core JVM tests (cast/Dlna.kt; android.util.Xml is a stub there).
kxml2 = { module = "net.sf.kxml:kxml2", version = "2.3.0" }

[bundles]
media3-player = ["androidx-media3-exoplayer", "androidx-media3-exoplayer-hls", "androidx-media3-datasource-okhttp"]
media3-app = ["androidx-media3-ui", "androidx-media3-session"]
coil = ["coil-compose", "coil-network-okhttp"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
